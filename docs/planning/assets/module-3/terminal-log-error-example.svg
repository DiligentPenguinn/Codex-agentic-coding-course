<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Ví dụ lỗi xuất hiện trong log ở Terminal</title>
  <desc id="description">Một cửa sổ Terminal hiển thị ứng dụng đang chạy, sau đó xuất hiện TypeError. Một chú thích chỉ vào phần thông tin có thể gửi cho agent.</desc>
  <defs>
    <linearGradient id="terminalBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#e8eef7"/>
  <rect x="58" y="42" width="1084" height="591" rx="18" fill="#0f172a" filter="url(#shadow)"/>
  <rect x="58" y="42" width="1084" height="54" rx="18" fill="#1e293b"/>
  <rect x="58" y="78" width="1084" height="18" fill="#1e293b"/>
  <circle cx="88" cy="69" r="7" fill="#f87171"/>
  <circle cx="112" cy="69" r="7" fill="#fbbf24"/>
  <circle cx="136" cy="69" r="7" fill="#34d399"/>
  <text x="600" y="75" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650" fill="#cbd5e1">Terminal — portfolio</text>

  <rect x="58" y="96" width="1084" height="537" fill="url(#terminalBackground)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
    <text x="108" y="152" fill="#94a3b8">$</text>
    <text x="132" y="152" fill="#f8fafc">npm run dev</text>
    <text x="108" y="201" fill="#64748b">&gt; portfolio@1.0.0 dev</text>
    <text x="108" y="234" fill="#64748b">&gt; vite</text>
    <text x="108" y="288" fill="#34d399">✓  Local:   http://localhost:5173/</text>
    <text x="108" y="321" fill="#94a3b8">✓  ready in 312 ms</text>

    <rect x="91" y="363" width="871" height="145" rx="12" fill="#451a1a" opacity="0.68" stroke="#f87171" stroke-width="2"/>
    <text x="108" y="403" fill="#fca5a5" font-weight="700">[portfolio] Không thể hiển thị danh sách dự án</text>
    <text x="108" y="442" fill="#fecaca">TypeError: projects.map is not a function</text>
    <text x="108" y="481" fill="#94a3b8">at ProjectList (src/components/ProjectList.tsx:18:24)</text>

    <text x="108" y="560" fill="#94a3b8">$</text>
    <rect x="132" y="543" width="11" height="22" fill="#cbd5e1" opacity="0.9"/>
  </g>

  <rect x="765" y="532" width="318" height="69" rx="14" fill="#fff7f7" stroke="#fecaca" stroke-width="2"/>
  <circle cx="798" cy="566" r="15" fill="#dc2626"/>
  <text x="798" y="572" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#ffffff">!</text>
  <text x="827" y="561" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991b1b">Thông tin giúp agent</text>
  <text x="827" y="583" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991b1b">tìm nguyên nhân</text>
  <path d="M 765 553 C 699 531, 660 505, 614 472" fill="none" stroke="#f87171" stroke-width="4" marker-end="url(#arrowhead)"/>
</svg>
