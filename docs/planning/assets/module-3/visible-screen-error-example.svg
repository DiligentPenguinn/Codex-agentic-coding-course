<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Ví dụ một lỗi có thể nhìn thấy trên màn hình</title>
  <desc id="description">Một trang portfolio trong trình duyệt có nút Xem dự án che lên phần giới thiệu. Một chú thích chỉ vào vùng bị lỗi.</desc>
  <defs>
    <linearGradient id="pageBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#e8eef7"/>
  <rect x="58" y="42" width="1084" height="591" rx="18" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="58" y="42" width="1084" height="54" rx="18" fill="#f8fafc"/>
  <rect x="58" y="78" width="1084" height="18" fill="#f8fafc"/>
  <circle cx="88" cy="69" r="7" fill="#f87171"/>
  <circle cx="112" cy="69" r="7" fill="#fbbf24"/>
  <circle cx="136" cy="69" r="7" fill="#34d399"/>
  <rect x="230" y="56" width="740" height="27" rx="13.5" fill="#e2e8f0"/>
  <text x="600" y="75" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">localhost:5173</text>

  <rect x="58" y="96" width="1084" height="537" fill="url(#pageBackground)"/>
  <rect x="58" y="96" width="1084" height="74" fill="#ffffff"/>
  <text x="116" y="141" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">PORTFOLIO</text>
  <text x="815" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#334155">Giới thiệu</text>
  <text x="924" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#334155">Dự án</text>
  <text x="1009" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#334155">Liên hệ</text>

  <text x="116" y="263" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650" letter-spacing="2" fill="#4f46e5">PRODUCT DESIGNER</text>
  <text x="116" y="327" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="750" fill="#0f172a">Mình biến ý tưởng thành</text>
  <text x="116" y="385" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="750" fill="#0f172a">trải nghiệm dễ sử dụng.</text>
  <text x="116" y="447" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#475569">Đây là nơi mình giới thiệu những dự án đã thực hiện và</text>
  <text x="116" y="478" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#475569">cách mình giải quyết vấn đề cho người dùng.</text>

  <rect x="327" y="424" width="190" height="72" rx="14" fill="#4f46e5"/>
  <text x="422" y="469" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff">Xem dự án</text>
  <rect x="315" y="412" width="214" height="96" rx="19" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 7"/>

  <rect x="754" y="236" width="298" height="236" rx="28" fill="#c7d2fe"/>
  <circle cx="903" cy="324" r="67" fill="#818cf8"/>
  <rect x="825" y="386" width="156" height="24" rx="12" fill="#6366f1" opacity="0.72"/>
  <rect x="853" y="424" width="100" height="14" rx="7" fill="#6366f1" opacity="0.45"/>

  <rect x="721" y="511" width="350" height="71" rx="14" fill="#fff7f7" stroke="#fecaca" stroke-width="2"/>
  <circle cx="754" cy="546" r="15" fill="#dc2626"/>
  <text x="754" y="552" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#ffffff">!</text>
  <text x="783" y="540" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#991b1b">Nút đang che nội dung</text>
  <text x="783" y="562" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#b91c1c">Có thể chụp lại và gửi ảnh cho agent.</text>
  <path d="M 721 538 C 645 530, 584 510, 520 482" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowhead)"/>
