<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Team Workload Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #e9ece9;
      --board: #f8f8f3;
      --surface: #ffffff;
      --surface-raised: #f0f1ec;
      --ink: #151a1d;
      --muted: #586168;
      --line: #7f898f;
      --line-soft: #c7cdcf;
      --duy: #bb4e12;
      --triet: #1266a8;
      --split: #6945b3;
      --joint: #08745c;
      --focus: #006fd6;
      --shadow: 0 10px 28px rgba(23, 31, 35, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101416;
        --board: #171c1f;
        --surface: #22292d;
        --surface-raised: #2b3337;
        --ink: #f3f5f0;
        --muted: #b7c0c4;
        --line: #8f9ba1;
        --line-soft: #3b464b;
        --duy: #ff985d;
        --triet: #6bbaff;
        --split: #b89cff;
        --joint: #5ed4b5;
        --focus: #6bbaff;
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(var(--line-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-soft) 1px, transparent 1px),
        var(--page);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: Bahnschrift, "Arial Narrow", "Segoe UI", sans-serif;
    }

    a {
      color: var(--focus);
    }

    .page {
      width: min(1560px, calc(100% - 28px));
      margin: 14px auto;
      padding: clamp(18px, 3vw, 38px);
      border: 1px solid var(--line);
      background: var(--board);
      box-shadow: var(--shadow);
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--ink);
    }

    .eyebrow,
    .layer-label,
    .owner,
    .legend-title {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      font-stretch: condensed;
      letter-spacing: -0.045em;
      line-height: 0.92;
    }

    .instruction {
      max-width: 320px;
      margin: 0;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .instruction strong {
      color: var(--ink);
    }

    .graph-shell {
      overflow-x: auto;
      padding: 28px 2px 10px;
    }

    .graph {
      width: max-content;
      min-width: 100%;
    }

    .journey-row,
    .detail-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
    }

    .workflow-arrow {
      display: grid;
      flex: 0 0 auto;
      width: 28px;
      place-items: center;
      color: var(--line);
      font-family: "Segoe UI Symbol", sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
    }

    .node {
      position: relative;
      flex: 0 0 auto;
      width: 142px;
      min-height: 108px;
      padding: 14px 42px 14px 14px;
      border: 2px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: 5px 5px 0 var(--line-soft);
    }

    .node[data-tone="duy"] {
      border-color: var(--duy);
    }

    .node[data-tone="triet"] {
      border-color: var(--triet);
    }

    .node[data-tone="split"] {
      border-color: var(--split);
    }

    .node[data-tone="joint"] {
      border-color: var(--joint);
    }

    .node[aria-current="true"] {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .node-title {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.15;
    }

    .owner {
      margin-bottom: 11px;
    }

    [data-tone="duy"] .owner {
      color: var(--duy);
    }

    [data-tone="triet"] .owner {
      color: var(--triet);
    }

    [data-tone="split"] .owner {
      color: var(--split);
    }

    [data-tone="joint"] .owner {
      color: var(--joint);
    }

    .expand,
    .explain {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      width: 28px;
      height: 28px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--surface-raised);
      color: var(--ink);
      cursor: pointer;
      font: 800 1.2rem/1 Bahnschrift, sans-serif;
    }

    .explain {
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      font-style: italic;
    }

    .expand:hover,
    .explain:hover {
      border-color: var(--focus);
      color: var(--focus);
    }

    .expand:focus-visible,
    .explain:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .layer-divider {
      display: flex;
      min-width: 1160px;
      align-items: center;
      gap: 14px;
      padding: 22px 0 14px;
      color: var(--muted);
    }

    .layer-divider::before,
    .layer-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .layer-label {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--surface-raised);
      color: var(--ink);
      white-space: nowrap;
    }

    .empty-layer {
      min-width: 1160px;
      padding: 22px;
      border: 1px dashed var(--line);
      color: var(--muted);
      text-align: center;
    }

    .detail-row .node {
      width: 164px;
      min-height: 94px;
    }

    .detail-row .leaf {
      min-height: 76px;
      padding-right: 42px;
      box-shadow: none;
    }

    .leaf-description {
      margin: 12px -28px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 0.78rem;
      line-height: 1.38;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
      margin-top: 22px;
      padding: 15px 0 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }

    .legend-title {
      color: var(--ink);
    }

    .legend-item {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.85rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .legend-item.duy {
      color: var(--duy);
    }

    .legend-item.triet {
      color: var(--triet);
    }

    .legend-item.split {
      color: var(--split);
    }

    .legend-item.joint {
      color: var(--joint);
    }

    .agreement {
      margin-left: auto;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.86rem;
    }

    .noscript {
      margin-top: 22px;
      padding: 16px;
      border: 2px solid var(--joint);
      background: var(--surface);
      font-family: "Segoe UI", sans-serif;
    }

    @media (max-width: 760px) {
      .page {
        width: 100%;
        margin: 0;
        border-right: 0;
        border-left: 0;
      }

      .masthead {
        grid-template-columns: 1fr;
      }

      .agreement {
        width: 100%;
        margin-left: 0;
      }
    }

    @media (forced-colors: active) {
      .node,
      .expand,
      .explain,
      .layer-label {
        border-color: CanvasText;
      }
    }
  </style>
</head>

    <header class="masthead">
      <div>

    <section class="graph-shell" aria-label="Interactive team workload graph">

    <footer class="legend">

      </div>
    </noscript>
  </main>

  <script id="graph-logic">
    function nextGraphState(state, kind, id) {
      if (kind === "step") {
        return state.openStep === id
          ? { openStep: null, openChild: null, openLeaf: null }
          : { openStep: id, openChild: null, openLeaf: null };
      }

      if (kind === "child" && state.openStep) {
        return {
          openStep: state.openStep,
          openChild: state.openChild === id ? null : id,
          openLeaf: null,
        };
      }

      if (kind === "leaf" && state.openChild) {
        return {
          openStep: state.openStep,
          openChild: state.openChild,
          openLeaf: state.openLeaf === id ? null : id,
        };
      }

      return { ...state };
    }

    globalThis.WorkloadMap = Object.freeze({ nextGraphState });
  </script>

  <script id="graph-app">
    const workflow = JSON.parse(
      document.getElementById("workflow-data").textContent,
    );
    const graph = document.getElementById("graph");
    let graphState = { openStep: null, openChild: null, openLeaf: null };

    function escapeText(value) {
      const span = document.createElement("span");
      span.textContent = value;
      return span.innerHTML;
    }

    function nodeHtml(node, kind, isActive = false) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const isExpanded =
        kind === "step"
          ? graphState.openStep === node.id
          : kind === "child"
            ? graphState.openChild === node.id
            : graphState.openLeaf === node.id;
      const current = isActive ? ' aria-current="true"' : "";
      const leafClass = kind === "leaf" ? " leaf" : "";
      const expandButton = hasChildren
        ? `
          <button
            class="expand"
            type="button"
            data-kind="${kind}"
            data-id="${escapeText(node.id)}"
            aria-label="${isExpanded ? "Hide" : "Expand"} ${escapeText(node.title)}"
            aria-expanded="${isExpanded}"
          >${isExpanded ? "−" : "+"}</button>
        `
        : "";
      const explainButton =
        kind === "leaf" && node.description
          ? `
            <button
              class="explain"
              type="button"
              data-kind="leaf"
              data-id="${escapeText(node.id)}"
              aria-label="${isExpanded ? "Hide" : "Show"} description for ${escapeText(node.title)}"
              aria-expanded="${isExpanded}"
            >i</button>
          `
          : "";
      const description =
        kind === "leaf" && isExpanded
          ? `<p class="leaf-description">${escapeText(node.description)}</p>`
          : "";

      return `
        <article class="node${leafClass}" data-tone="${node.tone}"${current}>
          <div class="owner">${escapeText(node.owner)}</div>
          <div class="node-title">${escapeText(node.title)}</div>
          ${expandButton}
          ${explainButton}
          ${description}
        </article>
      `;
    }

    function journeyHtml() {
      return `
        <div class="journey-row">
          ${workflow
            .map(
              (node, index) => `
                ${index ? '<div class="workflow-arrow" aria-hidden="true">→</div>' : ""}
                ${nodeHtml(node, "step", graphState.openStep === node.id)}
              `,
            )
            .join("")}
        </div>
      `;
    }

    function layerDivider(level, title) {
      const label =
        level === 2
          ? `Layer 2 · Inside “${escapeText(title)}”`
          : `Layer 3 · Inside “${escapeText(title)}”`;

      return `
        <div class="layer-divider">
          <span class="layer-label">${label}</span>
        </div>
      `;
    }

    function detailRowHtml(nodes, kind, activeId = null) {
      return `
        <div class="detail-row">
          ${nodes
            .map((node) => nodeHtml(node, kind, node.id === activeId))
            .join("")}
        </div>
      `;
    }

    function render(focusKind = null, focusId = null) {
      let html = journeyHtml();

      if (!graphState.openStep) {
        html += `
          <div class="layer-divider">
            <span class="layer-label">Layer 2 · Choose one journey step</span>
          </div>
          <div class="empty-layer">Press + on the step you need.</div>
        `;
      } else {
        const step = workflow.find((item) => item.id === graphState.openStep);
        html += layerDivider(2, step.title);
        html += detailRowHtml(step.children, "child", graphState.openChild);

        if (graphState.openChild) {
          const child = step.children.find(
            (item) => item.id === graphState.openChild,
          );
          html += layerDivider(3, child.title);
          html += detailRowHtml(child.children, "leaf", graphState.openLeaf);
        }
      }

      graph.innerHTML = html;
      bindButtons();

      if (focusKind && focusId) {
        graph
          .querySelector(
            `[data-kind="${focusKind}"][data-id="${focusId}"]`,
          )
          ?.focus();
      }
    }

    function bindButtons() {
      graph.querySelectorAll(".expand, .explain").forEach((button) => {
        button.addEventListener("click", () => {
          const { kind, id } = button.dataset;
          graphState = WorkloadMap.nextGraphState(graphState, kind, id);
          render(kind, id);
        });
      });
    }

    render();
  </script>
</body>
</html>
